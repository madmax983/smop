[package]
name = "smop"
version = "0.1.1"
edition = "2024"
description = "Batteries-included scripting utilities for Rust"
license = "MIT OR Apache-2.0"
keywords = ["scripting", "cli", "utilities"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/madmax983/smop"
homepage = "https://github.com/madmax983/smop"
documentation = "https://docs.rs/smop"
readme = "README.md"

[features]
default = ["full"]
full = ["http", "cli", "print", "csv"]
http = ["dep:ureq"]
cli = ["dep:clap"]
print = ["dep:console", "dep:indicatif", "dep:dialoguer"]
csv = ["dep:csv"]
nova = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", features = ["json"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
console = { version = "0.15", optional = true }
indicatif = { version = "0.17", optional = true }
dialoguer = { version = "0.11", optional = true }
csv = { version = "1.3", optional = true }
dirs = "6"
shellexpand = "3"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[[example]]
name = "fetch_api"
required-features = ["http", "cli", "print"]

[[example]]
name = "file_processor"
required-features = ["print"]

[[example]]
name = "interactive_cli"
required-features = ["print"]

[lints.rust]
# Using deny (not forbid) to allow unsafe in tests for std::env::set_var (Rust 2024)
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
