name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Every job only reads the repository: least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

# Whole-workspace runs pass --workspace, so smop-macros (ADR 0007) is tested
# and linted once it joins; it is not a default member. Per-feature runs pass
# -p smop and take their list from scripts/ci-features.sh (cargo metadata), so
# a new feature is checked on its own without editing this file.

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (all features)
        run: cargo test --workspace --all-features

      - name: Run tests (no default features)
        run: cargo test -p smop --no-default-features

      - name: Run tests (individual features)
        shell: bash
        run: |
          features=$(bash scripts/ci-features.sh)
          for f in $features; do
            echo "::group::cargo test --features $f"
            cargo test -p smop --no-default-features --features "$f"
            echo "::endgroup::"
          done

      # ADR 0011: `script` alone adds no crates, so no signal crate.
      - name: script adds no signal crate
        shell: bash
        run: |
          tree=$(cargo tree -p smop --no-default-features --features script -e normal --prefix none)
          echo "$tree"
          if echo "$tree" | grep -q signal; then exit 1; fi

      - name: Run tests (xtask feature set)
        run: cargo test -p smop --no-default-features --features sh,fs,path

      # A crate depending only on smop: catches re-exports that smop's own
      # tests can't (they see every smop dependency as an extern crate).
      - name: Consumer crate (derives without direct clap/serde deps)
        run: cargo run --manifest-path tests/consumer/Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --lib --examples -- -D warnings

      - name: Clippy (each feature alone)
        run: |
          cargo clippy -p smop --no-default-features -- -D warnings
          features=$(bash scripts/ci-features.sh)
          for f in $features; do
            echo "::group::cargo clippy --features $f"
            cargo clippy -p smop --no-default-features --features "$f" -- -D warnings
            echo "::endgroup::"
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The project standard is 85-90% line coverage; the gate is the low end.
      # Doctests aren't counted (that needs nightly).
      - name: Line coverage (fails under 85%)
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 85

  semver:
    name: Semver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Compares the public API with the latest smop on crates.io. The release
      # type comes from Cargo.toml's version: 0.3.2 -> 0.4.0 allows breaking
      # changes, and once 0.4.0 is published the same check rejects them in
      # 0.4.x. Behaviour-only changes are invisible to it; changelog.d/ lists
      # those by hand.
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: smop

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

      # Check that the public API has no types of dependencies that smop
      # does not re-export. Policy: "API boundaries" in CLAUDE.md.
      - name: API boundary
        run: bash scripts/api_boundary.sh

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Every `module::symbol` in README/CLAUDE/ADRs must exist in src/.
      # Baseline: 0 drifted symbols. Run locally: bash scripts/docs_drift.sh
      - name: Docs drift scan
        run: bash scripts/docs_drift.sh

      # Feature table in CLAUDE.md must match Cargo.toml's dep: lists. Baseline: 0.
      - name: Docs feature-table scan
        run: python3 scripts/docs_features.py

      # Unreleased changes are fragments in changelog.d/, not CHANGELOG.md.
      - name: Changelog fragments
        run: |
          python3 -I -W error scripts/test_changelog.py
          python3 -I scripts/changelog.py check

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-version in Cargo.toml (std::fs::File::lock, used by
          # fs::lock, needs 1.89; zip 9 and comfy-table 8 need 1.88)
          toolchain: "1.89"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-features

  dx:
    name: DX (clean-room first run, doc snippets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Doc snippets compile (README.md, CLAUDE.md)
        run: scripts/dx/snippets.sh

      # README's install + first snippet, against this checkout (crates.io lags a release)
      - name: Clean-room first run
        run: SMOP_PATH="$PWD" scripts/dx/clean_room.sh
