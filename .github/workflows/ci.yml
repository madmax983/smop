name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (all features)
        run: cargo test --all-features

      - name: Run tests (no default features)
        run: cargo test --no-default-features

      - name: Run tests (individual features)
        shell: bash
        run: |
          for f in sh fs path env serde json toml glob csv http cli print time archive; do
            echo "::group::cargo test --features $f"
            cargo test --no-default-features --features "$f"
            echo "::endgroup::"
          done

      - name: Run tests (xtask feature set)
        run: cargo test --no-default-features --features sh,fs,path

      # A crate depending only on smop: catches re-exports that smop's own
      # tests can't (they see every smop dependency as an extern crate).
      - name: Consumer crate (derives without direct clap/serde deps)
        run: cargo run --manifest-path tests/consumer/Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features --lib --examples -- -D warnings

      - name: Clippy (each feature alone)
        run: |
          cargo clippy --no-default-features -- -D warnings
          for f in sh fs path env serde json toml glob csv http cli print time archive; do
            echo "::group::cargo clippy --features $f"
            cargo clippy --no-default-features --features "$f" -- -D warnings
            echo "::endgroup::"
          done

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-version in Cargo.toml (zip 9 and comfy-table 8 require 1.88)
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --all-features
