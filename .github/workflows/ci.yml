name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Every job only reads the repository: least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

# Whole-workspace runs pass --workspace, so they test and lint smop-macros
# (ADR 0007). It is not a default member. Per-feature runs pass -p smop and
# take their list from `cargo xtask ci-features` (cargo metadata). So a new
# feature is checked on its own without editing this file.
#
# The checks and release steps are `cargo xtask` tasks, written with smop
# (ADR 0017). `cargo xtask --help` lists them; each runs the same locally.

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests (all features)
        run: cargo test --workspace --all-features

      - name: Run tests (no default features)
        run: cargo test -p smop --no-default-features

      - name: Run tests (individual features)
        shell: bash
        run: |
          features=$(cargo xtask ci-features)
          for f in $features; do
            echo "::group::cargo test --features $f"
            cargo test -p smop --no-default-features --features "$f"
            echo "::endgroup::"
          done

      # ADR 0011: `script` alone adds no crates, so no signal crate.
      - name: script adds no signal crate
        shell: bash
        run: |
          tree=$(cargo tree -p smop --no-default-features --features script -e normal --prefix none)
          echo "$tree"
          if echo "$tree" | grep -q signal; then exit 1; fi

      # ADR 0007: `sh` alone adds no crate, and smop-macros has no dependencies.
      # ADR 0014: `git` adds no crate either. Build dependencies count too.
      - name: sh, git and smop-macros add no crates
        shell: bash
        run: |
          for f in sh git; do
            tree=$(cargo tree -p smop --no-default-features --features "$f" -e normal,build --prefix none | tr -d '\r')
            echo "$tree"
            [ "$(echo "$tree" | grep -vc '^smop ')" = 1 ] || { echo "::error::$f adds a crate"; exit 1; }
            echo "$tree" | grep -q '^anyhow ' || { echo "::error::anyhow is not in the $f tree"; exit 1; }
          done
          macros_tree=$(cargo tree -p smop-macros -e normal,build --prefix none | tr -d '\r')
          echo "$macros_tree"
          echo "$macros_tree" | grep -q '^smop-macros ' || { echo "::error::no tree for smop-macros"; exit 1; }
          [ "$(echo "$macros_tree" | wc -l)" -eq 1 ] || { echo "::error::smop-macros has a dependency"; exit 1; }

      - name: Run tests (xtask feature set)
        run: cargo test -p smop --no-default-features --features sh,fs,path

      # A crate depending only on smop: catches re-exports that smop's own
      # tests can't (they see every smop dependency as an extern crate).
      # It also calls cmd! with no smop-macros dependency.
      - name: Consumer crate (derives without direct clap/serde deps)
        run: cargo run --manifest-path tests/consumer/Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-targets also lints tests, examples and smop-macros' unit tests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (each feature alone)
        run: |
          cargo clippy -p smop --no-default-features -- -D warnings
          features=$(cargo xtask ci-features)
          for f in $features; do
            echo "::group::cargo clippy --features $f"
            cargo clippy -p smop --no-default-features --features "$f" -- -D warnings
            echo "::endgroup::"
          done

  # The cmd! compile-fail cases (tests/ui). The text of rustc errors changes
  # between releases. It also names a type by a longer path when the crate
  # graph has a second type of that name. So the snapshots are for one
  # pinned toolchain and for the `macros` feature alone.
  compile-fail:
    name: cmd! compile-fail cases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          # tests/ui/README.md lists each place that has this version.
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The test is #[ignore]. The grep fails the step if the test did not run.
      - name: Compile-fail cases
        shell: bash
        run: |
          cargo test -p smop --no-default-features --features macros --test cmd_macro_errors \
            -- --ignored --exact each_case_fails_with_its_snapshot | tee compile-fail.log
          grep -q 'test result: ok. 1 passed' compile-fail.log

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The project standard is 85-90% line coverage; the gate is the low end.
      # Doctests aren't counted (that needs nightly).
      - name: Line coverage (fails under 85%)
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 85

  semver:
    name: Semver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Compares the public API with the latest smop on crates.io. The release
      # type comes from Cargo.toml's version: 0.3.2 -> 0.4.0 allows breaking
      # changes, and once 0.4.0 is published the same check rejects them in
      # 0.4.x. Behaviour-only changes are invisible to it; changelog.d/ lists
      # those by hand.
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: smop

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

      # Check that the public API has no types of dependencies that smop
      # does not re-export. Policy: "API boundaries" in CLAUDE.md.
      - name: API boundary
        run: cargo xtask api-boundary

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Every `module::symbol` in README/CLAUDE/ADRs must exist in src/.
      # Baseline: 0 drifted symbols.
      - name: Docs drift scan
        run: cargo xtask docs-drift

      # Feature table in CLAUDE.md must match Cargo.toml's dep: lists. Baseline: 0.
      - name: Docs feature-table scan
        run: cargo xtask docs-features

      # Unreleased changes are fragments in changelog.d/, not CHANGELOG.md.
      # The tool's own tests run with `cargo test --workspace`.
      - name: Changelog fragments
        run: cargo xtask changelog check

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Builds each example with only its required-features and checks that
      # README.md lists it. Then builds all examples with all features.
      - name: Build examples
        run: cargo xtask examples

      # These examples need no network and no terminal.
      - name: Run examples
        run: |
          cargo run --example env_report
          cargo run --example shell_automation
          cargo run --example archive_backup

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-version in Cargo.toml and smop-macros/Cargo.toml
          # (std::fs::File::lock, used by fs::lock, needs 1.89; zip 9 and
          # comfy-table 8 need 1.88)
          toolchain: "1.89"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --workspace also builds smop-macros.
      - name: Check MSRV
        run: cargo check --workspace --all-features

  dx:
    name: DX (clean-room first run, doc snippets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Doc snippets compile (README.md, CLAUDE.md)
        run: cargo xtask snippets

      # README's install + first snippet, against this checkout (crates.io lags a release)
      - name: Clean-room first run
        run: cargo xtask clean-room --smop-path "$PWD"
