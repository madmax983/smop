# A crate that depends on smop and nothing else, used by CI to prove that
# smop's derive re-exports (clap, serde) and its serde_json, toml and regex
# (`smop::re`) re-exports work without the consumer adding those crates as
# direct dependencies. It also calls `cmd!` with no `smop-macros` dependency.
#
#   cargo run --manifest-path tests/consumer/Cargo.toml
[package]
name = "smop-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[dependencies]
smop = { path = "../..", default-features = false, features = ["cli", "serde", "json", "toml", "http", "re", "macros"] }
